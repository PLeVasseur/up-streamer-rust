[package]
name = "configurable-streamer-wire-support"
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true

[features]
default = []
zenoh-zero-copy = ["dep:up-transport-zenoh", "dep:up-wire-xcdrv2", "up-transport-zenoh/zero-copy"]
iceoryx2-zero-copy = ["dep:up-transport-iceoryx2-rust", "dep:up-wire-xcdrv2"]
lola-transport = ["dep:up-transport-lola-rust", "dep:up-wire-xcdrv2", "up-transport-lola-rust/zero-copy"]
owned-frame-transport = ["dep:up-wire-xcdrv2", "up-streamer/owned-frame-transport"]
zenoh-owned-frame = ["owned-frame-transport", "dep:up-transport-zenoh", "up-transport-zenoh/benchmark-owned"]
iceoryx2-owned-frame = ["owned-frame-transport", "dep:up-transport-iceoryx2-rust", "up-transport-iceoryx2-rust/benchmark-owned"]
lola-owned-frame = ["owned-frame-transport", "dep:up-transport-lola-rust", "up-transport-lola-rust/benchmark-owned", "up-transport-lola-rust/zero-copy"]

[dependencies]
up-rust = { workspace = true }
up-streamer = { path = "../../up-streamer", features = ["experimental-copy-minimized-routing"] }
up-transport-zenoh = { workspace = true, optional = true }
up-transport-iceoryx2-rust = { workspace = true, optional = true }
up-transport-lola-rust = { git = "https://github.com/PLeVasseur/up-transport-lola-rust.git", rev = "dc7179763085091c0beea17643779d0ff3d8381d", optional = true }
up-wire-xcdrv2 = { git = "ssh://git@github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "3aa96b68317e6d90d718c2267b53bccfab9a57ec", optional = true }
