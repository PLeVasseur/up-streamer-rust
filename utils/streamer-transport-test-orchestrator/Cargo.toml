[lints]
workspace = true

[package]
name = "streamer-transport-test-orchestrator"
rust-version.workspace = true
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true

[dependencies]
streamer-soak = { path = "../streamer-soak" }
streamer-flow-evidence = { path = "../streamer-flow-evidence" }
configurable-streamer-wire-support = { path = "../configurable-streamer-wire-support" }
up-rust = { workspace = true, features = ["cloudevents"] }
protobuf = { workspace = true }
up-native-profile = { workspace = true }
anyhow = { version = "1.0.98" }
chrono = { version = "0.4.40", default-features = true, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
libc = { version = "0.2.171" }
signal-hook = "=0.3.18"
sha2 = "0.10"

[features]
payload-contract-large-fixtures = ["configurable-streamer-wire-support/payload-contract-large-fixtures", "up-rust/payload-contract-large-fixtures"]

[dev-dependencies]
test-case = "3.3"
tempfile = "3.27"
