[[bin]]
name = "iceoryx2_subscriber"
required-features = ["iceoryx2-selected-wire"]

[[bin]]
name = "iceoryx2_notifier"
required-features = ["iceoryx2-selected-wire"]

[[bin]]
name = "iceoryx2_notifyee"
required-features = ["iceoryx2-selected-wire"]

[[bin]]
