[features]
payload-contract-large-fixtures = ["sustained-workload", "up-rust/payload-contract-large-fixtures", "configurable-streamer-wire-support/payload-contract-large-fixtures"]
sustained-workload = ["flow-evidence", "selected-wire-common", "wire-formats", "up-rust/util", "dep:streamer-soak", "dep:serde_json", "dep:sha2"]
flow-evidence = ["dep:streamer-flow-evidence", "up-rust/cloudevents", "dep:serde_json", "dep:sha2"]
selected-wire-common = ["up-rust/owned-frame-transport", "up-rust/selected-wire-user-api", "dep:configurable-streamer-wire-support"]
wire-formats = ["up-wire-arrow", "up-wire-omgidl", "up-wire-xcdrv2"]
zenoh-transport = ["selected-wire-common", "wire-formats", "up-transport-zenoh", "up-transport-zenoh/benchmark-owned", "up-transport-zenoh/zero-copy", "zenoh", "configurable-streamer-wire-support/zenoh-zero-copy"]
zenoh-owned-frame = ["selected-wire-common", "zenoh-transport", "up-transport-zenoh/benchmark-owned", "up-wire-xcdrv2"]
zenoh-zero-copy = ["selected-wire-common", "zenoh-transport", "up-transport-zenoh/zero-copy", "up-wire-xcdrv2", "configurable-streamer-wire-support/zenoh-zero-copy"]
zenoh-selected-wire = ["zenoh-owned-frame", "zenoh-zero-copy"]
iceoryx2-owned-frame = ["selected-wire-common", "wire-formats", "up-transport-iceoryx2-rust", "up-transport-iceoryx2-rust/benchmark-owned", "configurable-streamer-wire-support/iceoryx2-owned-frame"]
iceoryx2-zero-copy = ["selected-wire-common", "wire-formats", "up-transport-iceoryx2-rust", "configurable-streamer-wire-support/iceoryx2-zero-copy"]
iceoryx2-selected-wire = ["iceoryx2-owned-frame", "iceoryx2-zero-copy"]
lola-transport = ["selected-wire-common", "wire-formats", "up-transport-lola-rust", "configurable-streamer-wire-support/lola-transport"]
lola-owned-frame = ["lola-transport", "up-transport-lola-rust/benchmark-owned"]
lola-zero-copy = ["lola-transport"]
lola-selected-wire = ["lola-owned-frame", "lola-zero-copy"]
vsomeip-transport = ["up-transport-vsomeip", "selected-wire-common", "wire-formats"]
bundled-vsomeip = ["up-transport-vsomeip/bundled"]
mqtt-transport = ["up-transport-mqtt5", "selected-wire-common", "wire-formats"]
dds-transport = ["selected-wire-common", "wire-formats", "up-transport-dds"]

[dependencies]
bytes = { workspace = true }
streamer-soak = { path = "../utils/streamer-soak", optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
streamer-flow-evidence = { path = "../utils/streamer-flow-evidence", optional = true }
configurable-streamer-wire-support = { path = "../utils/configurable-streamer-wire-support", optional = true }
async-trait = { workspace = true }
chrono = { version = "0.4" }
clap = { version = "4.5.9", features = ["derive"] }
hello-world-protos = { path = "../utils/hello-world-protos" }
json5 = { workspace = true }
protobuf = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
up-rust = { workspace = true }
up-transport-iceoryx2-rust = { workspace = true, optional = true }
up-transport-lola-rust = { git = "https://github.com/PLeVasseur/up-transport-lola-rust.git", rev = "8ad33796111a092ac8957165c26e945b65b72061", optional = true }
up-transport-zenoh = { workspace = true, optional = true }
up-transport-vsomeip = { workspace = true, optional = true }
up-transport-mqtt5 = { workspace = true, optional = true }
up-transport-dds = { workspace = true, optional = true }
up-wire-arrow = { workspace = true, optional = true }
up-wire-omgidl = { workspace = true, optional = true }
up-wire-xcdrv2 = { workspace = true, optional = true }
zenoh = { workspace = true, optional = true }
