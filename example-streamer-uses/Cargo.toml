required-features = ["mqtt-transport"]

[[bin]]
name = "mqtt_publisher"
required-features = ["mqtt-transport"]

[[bin]]
name = "mqtt_notifier"
required-features = ["mqtt-transport"]

[[bin]]
name = "mqtt_notifyee"
required-features = ["mqtt-transport"]

[[bin]]
