[workspace]
resolver = "2"
members = [
    "example-streamer-uses",
    "example-streamer-implementations",
    "utils/criterion-guardrail",
    "utils/transport-smoke-suite",
    "configurable-streamer",
    "up-streamer",
    "utils/usubscription-static-file",
]

[workspace.package]
rust-version = "1.88"
version = "0.2.0"
repository = "https://github.com/eclipse-uprotocol/up-streamer-rust"
homepage = "https://github.com/eclipse-uprotocol"
edition = "2021"
keywords = ["uProtocol", "SDV", "routing", "streamer"]
license = "Apache-2.0"

[workspace.dependencies]
async-trait = { version = "0.1" }
clap = { version = "4.5" }
futures = { version = "0.3.30" }
lazy_static = { version = "1.5.0" }
json5 = { version = "0.4.1" }
serde = { version = "1.0.154", features = ["derive"] }
serde_json = { version = "1.0.94" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.7.0" }
tokio = { version = "1.44", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "signal",
] }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "0b0201a8fa7a30c98c78c41221a4fac9eac954d8", default-features = false }
up-transport-zenoh = { git = "https://github.com/PLeVasseur/up-client-zenoh-rust.git", rev = "ea259cd4fc94165a7ec9c9d04aa52d160c1b01a9" }
up-transport-lola-rust = { git = "https://github.com/PLeVasseur/up-transport-lola-rust.git", rev = "20f25b7a20ef76fba8e4b4978d5f36dab8b42465" }
up-transport-iceoryx2-rust = { git = "https://github.com/PLeVasseur/up-transport-iceoryx2-rust.git", rev = "8db1cb9ae66324c2afe337f50bf5d2cbbcfd15f4" }
up-transport-mqtt5 = { git = "https://github.com/PLeVasseur/up-client-mqtt5-rust.git", rev = "eb71eedb7040b28ff415f5a3f2ce9629548b7766", default-features = false }
up-transport-vsomeip = { git = "https://github.com/PLeVasseur/up-client-vsomeip-rust.git", rev = "9fa93defb0b348c4c022a934b5d850be83bf2dde", default-features = false }
zenoh = { version = "1.2.1", features = [
    "default",
    "plugins",
    "unstable",
    "internal",
] }
zenoh-core = { version = "1.2.1" }
zenoh-plugin-trait = { version = "1.2.1" }
zenoh-result = { version = "1.2.1" }
zenoh-util = { version = "1.2.1" }

[profile.dev]
debug = true
opt-level = 0

[profile.fast]
inherits = "release"
opt-level = 3
debug = true
debug-assertions = true
overflow-checks = true
lto = false

[profile.release]
debug = false     # If you want debug symbol in release mode, set the env variable: RUSTFLAGS=-g
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
