[workspace]
resolver = "2"
members = [
    "example-streamer-uses",
    "utils/hello-world-protos",
    "utils/integration-test-utils",
    "example-streamer-implementations",
    "utils/criterion-guardrail",
    "utils/configurable-streamer-wire-support",
    "utils/streamer-transport-test-orchestrator",
    "utils/transport-smoke-suite",
    "configurable-streamer",
    "up-linux-streamer-plugin",
    "up-streamer",
    "utils/usubscription-static-file",
]

[workspace.package]
rust-version = "1.88"
version = "0.1.0"
repository = "https://github.com/eclipse-uprotocol/up-streamer-rust"
homepage = "https://github.com/eclipse-uprotocol"
edition = "2021"
keywords = ["uProtocol", "SDV", "routing", "streamer"]
license = "Apache-2.0"

[workspace.dependencies]
async-trait = { version = "0.1" }
bytes = { version = "1.11" }
clap = { version = "4.5" }
futures = { version = "0.3.30" }
lazy_static = { version = "1.5.0" }
json5 = { version = "0.4.1" }
serde = { version = "1.0.154", features = ["derive"] }
serde_json = { version = "1.0.94" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.7.0" }
tokio = { version = "1.44", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
protobuf = { version = "3.7.2", features = ["with-bytes"] }
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "c1d13ca31859b9cc0086ef5d4b953907f24094ec", default-features = false }
up-transport-zenoh = { git = "https://github.com/PLeVasseur/up-client-zenoh-rust.git", rev = "3e2a8e494be9196f9ea6866de8076ee48acc6fcf" }
up-transport-iceoryx2-rust = { git = "https://github.com/PLeVasseur/up-transport-iceoryx2-rust.git", rev = "df6fd48a285d5009626cf729bcf32e46f6be1182" }
up-transport-vsomeip = { git = "https://github.com/PLeVasseur/up-client-vsomeip-rust.git", rev = "5ca969eaa3ddb085b5a7ee20e51111d2cec72111", default-features = false }
up-transport-mqtt5 = { git = "https://github.com/PLeVasseur/up-client-mqtt5-rust.git", rev = "e5e712ef65ef0f18140278176b6900a1dd359ad2" }
up-transport-dds = { git = "https://github.com/PLeVasseur/up-transport-dds-rust.git", rev = "c64ae30e29d0bf6f7a6c7638e4009eb8dd1b8227" }
up-wire-xcdrv2 = { git = "https://github.com/PLeVasseur/up-wire-xcdrv2-rust.git", rev = "78c7002b0a6257e27165a059e04398732f8baf26" }
up-wire-arrow = { git = "https://github.com/PLeVasseur/up-wire-arrow-rust.git", rev = "073da57dec677497285fb40250eecc8181ac506b" }
up-wire-omgidl = { git = "https://github.com/PLeVasseur/up-wire-omgidl-rust.git", rev = "266466f2a72948ed283e63c298e2e621aee53d95" }
zenoh = { version = "1.2.1", features = [
    "default",
    "plugins",
    "unstable",
    "internal",
] }
zenoh-core = { version = "1.2.1" }
zenoh-plugin-trait = { version = "1.2.1" }
zenoh-result = { version = "1.2.1" }
zenoh-util = { version = "1.2.1" }

[patch."ssh://git@github.com/PLeVasseur/up-rust.git"]
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "c1d13ca31859b9cc0086ef5d4b953907f24094ec" }

[profile.dev]
debug = true
opt-level = 0

[profile.matrix]
inherits = "dev"
debug = 0
strip = "debuginfo"
incremental = false

[profile.fast]
inherits = "release"
opt-level = 3
debug = true
debug-assertions = true
overflow-checks = true
lto = false

[profile.release]
debug = false     # If you want debug symbol in release mode, set the env variable: RUSTFLAGS=-g
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
